<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page);display:grid;grid-template-columns:1fr 1fr}
.cell{display:flex;align-items:center;justify-content:center;gap:30px;padding:28px;box-sizing:border-box}
.light{background:#fff;border-right:1px solid var(--border-subtle)}
.dark{background:#000}
.stack{height:96px}.ms{height:74px}</style></head>
<body>
<div class="cell light"><img class="stack" src="../assets/wordmark-stacked-on-light.svg" alt="stacked wordmark"><img class="ms" src="../assets/logo-monogram-stacked-on-light.svg" alt="stacked monogram"></div>
<div class="cell dark"><img class="stack" src="../assets/wordmark-stacked-on-dark.svg" alt="stacked wordmark"><img class="ms" src="../assets/logo-monogram-stacked-on-dark.svg" alt="stacked monogram"></div>
</body></html>
