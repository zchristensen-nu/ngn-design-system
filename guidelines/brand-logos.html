<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cell{padding:26px 28px;display:flex;align-items:center;gap:22px;min-height:88px;box-sizing:border-box}
.light{background:#fff;border:1px solid var(--border-subtle)}
.dark{background:#000}
img{display:block}
.wm{height:26px}.mono{height:44px}.badge{height:60px}
.cap{position:absolute;font-size:10px;font-family:var(--font-mono)}</style></head>
<body><div class="grid">
<div class="cell light"><img class="wm" src="../assets/wordmark-horizontal-on-light.svg" alt="wordmark"></div>
<div class="cell dark"><img class="wm" src="../assets/wordmark-horizontal-on-dark.svg" alt="wordmark"></div>
<div class="cell light"><img class="mono" src="../assets/logo-monogram-horizontal-on-light.svg" alt="monogram"><img class="badge" src="../assets/logo-badge-on-light.svg" alt="badge"></div>
<div class="cell dark"><img class="mono" src="../assets/logo-monogram-horizontal-on-dark.svg" alt="monogram"><img class="badge" src="../assets/logo-badge-on-dark.svg" alt="badge"></div>
</div></body></html>
