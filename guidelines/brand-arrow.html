<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page);padding:var(--space-6) var(--space-5);display:flex;align-items:center;gap:36px}
.mark{width:96px;height:96px;flex:none;display:flex;align-items:center;justify-content:center}
.mark img{width:100%;height:100%;object-fit:contain;display:block}
.txt h3{margin:0 0 8px;font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:-.01em;line-height:1.1}
.txt p{margin:0;font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--text-secondary);max-width:420px}
.txt b{color:var(--ngn-red)}</style></head>
<body>
<div class="mark"><img src="../assets/arrow-red.png" alt="Northeast arrow"></div>
<div class="txt"><h3>Points northeast. Always.</h3><p>The arrow is NGN's connective mark — a nod to <b>Northeastern</b> and to forward momentum. It replaces the counter of a letter in the monogram and trails the wordmark. Keep it red, keep it 45°. Use the supplied <b>arrow-red / -black / -white</b> assets — don't redraw it.</p></div>
</body></html>
