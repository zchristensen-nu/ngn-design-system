<!-- @dsCard group="Colors" viewport="700x170" name="Brand core" subtitle="Black · White · Red 186U · Gold 871 — used in strict hierarchy" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page)}
.row{display:flex;gap:var(--space-3);padding:var(--space-5)}
.sw{flex:1;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);overflow:hidden}
.chip{height:74px}
.meta{padding:8px 10px}
.nm{font-family:var(--font-body);font-weight:900;font-size:13px;color:var(--text-primary)}
.hx{font-size:11px;color:var(--text-muted);letter-spacing:.04em}</style></head>
<body><div class="row">
<div class="sw"><div class="chip" style="background:#000"></div><div class="meta"><div class="nm">Black</div><div class="hx">#000000</div></div></div>
<div class="sw"><div class="chip" style="background:#fff;border-bottom:1px solid var(--border-subtle)"></div><div class="meta"><div class="nm">White</div><div class="hx">#FFFFFF</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ngn-red)"></div><div class="meta"><div class="nm">Red 186U</div><div class="hx">#C8102E · accent &lt;25%</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ngn-gold)"></div><div class="meta"><div class="nm">Gold 871</div><div class="hx">#A4804A · reserved ~5%</div></div></div>
</div></body></html>
