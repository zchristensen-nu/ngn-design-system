<!-- @dsCard group="Brand" viewport="700x220" name="Arrow watermark pattern" subtitle="Tone-on-tone — each tile sits on its matching background" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page);padding:24px;display:flex;gap:16px}
.tile{flex:1;height:172px;border-radius:var(--radius-sm);position:relative;overflow:hidden;border:1px solid var(--border-subtle)}
.pat{position:absolute;inset:0;background-repeat:repeat;background-size:118px auto}
.cap{position:absolute;left:12px;bottom:10px;font-family:var(--font-body);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.1em;z-index:1}</style></head>
<body>
<div class="tile" style="background:#000"><div class="pat" style="background-image:url('../assets/arrow-tile-black.png')"></div><span class="cap" style="color:#fff">Black · on black</span></div>
<div class="tile" style="background:#fff"><div class="pat" style="background-image:url('../assets/arrow-tile-white.png')"></div><span class="cap" style="color:var(--text-primary)">White · on white</span></div>
<div class="tile" style="background:var(--ngn-red)"><div class="pat" style="background-image:url('../assets/arrow-tile-red.png')"></div><span class="cap" style="color:#fff">Red · on red</span></div>
</body></html>
