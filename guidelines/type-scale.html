<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);padding:var(--space-5)}

.r span:first-child{width:56px;font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
.t{color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head>
<body>
<div class="r"><span>84</span><div class="t" style="font-family:var(--font-display);font-weight:300;font-size:44px;letter-spacing:-.01em">Display</div></div>
<div class="r"><span>48</span><div class="t" style="font-family:var(--font-display);font-weight:300;font-size:34px;letter-spacing:-.01em">Page headline</div></div>
<div class="r"><span>28</span><div class="t" style="font-family:var(--font-display);font-weight:500;font-size:24px">Card headline</div></div>
<div class="r"><span>18</span><div class="t" style="font-family:var(--font-body);font-weight:400;font-size:18px">Article body — Lato regular</div></div>
<div class="r"><span>14</span><div class="t" style="font-family:var(--font-body);font-weight:400;font-size:14px;color:var(--text-muted)">Caption / meta — Lato</div></div>
</body></html>
