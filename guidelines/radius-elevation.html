<!-- @dsCard group="Spacing" viewport="700x170" name="Radius & elevation" subtitle="Tight corners · soft neutral shadows" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-paper);padding:var(--space-6) var(--space-5)}
.row{display:flex;gap:26px;align-items:center}
.box{width:92px;height:64px;background:#fff;border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text-muted)}</style></head>
<body><div class="row">
<div class="box" style="border-radius:var(--radius-none)">none</div>
<div class="box" style="border-radius:var(--radius-sm)">sm 4</div>
<div class="box" style="border-radius:var(--radius-lg)">lg 10</div>
<div class="box" style="box-shadow:var(--shadow-sm);border-color:transparent">sm</div>
<div class="box" style="box-shadow:var(--shadow-md);border-color:transparent">md</div>
<div class="box" style="box-shadow:var(--shadow-lg);border-color:transparent">lg</div>
</div></body></html>
