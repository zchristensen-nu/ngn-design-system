<!-- @dsCard group="Colors" viewport="700x150" name="Semantic roles" subtitle="Surface / text / border / accent aliases" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page);padding:var(--space-5)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3)}
.cell{border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:12px;font-size:11px}
.dot{width:22px;height:22px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);margin-bottom:8px}
.lab{font-family:var(--font-body);font-weight:700;font-size:12px;color:var(--text-primary)}
.v{color:var(--text-muted);font-size:10px}</style></head>
<body><div class="grid">
<div class="cell"><div class="dot" style="background:var(--surface-paper)"></div><div class="lab">surface-paper</div><div class="v">--neutral-50</div></div>
<div class="cell"><div class="dot" style="background:var(--surface-inverse)"></div><div class="lab">surface-inverse</div><div class="v">--ngn-black</div></div>
<div class="cell"><div class="dot" style="background:var(--accent)"></div><div class="lab">accent</div><div class="v">--ngn-red</div></div>
<div class="cell"><div class="dot" style="background:var(--prestige)"></div><div class="lab">prestige</div><div class="v">--ngn-gold</div></div>
<div class="cell"><div class="dot" style="background:var(--text-primary)"></div><div class="lab">text-primary</div><div class="v">#000</div></div>
<div class="cell"><div class="dot" style="background:var(--text-secondary)"></div><div class="lab">text-secondary</div><div class="v">--neutral-600</div></div>
<div class="cell"><div class="dot" style="background:var(--border-default)"></div><div class="lab">border-default</div><div class="v">--neutral-300</div></div>
<div class="cell"><div class="dot" style="background:var(--accent-tint)"></div><div class="lab">accent-tint</div><div class="v">--red-100</div></div>
</div></body></html>
