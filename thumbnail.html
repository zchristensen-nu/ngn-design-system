<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%}
  .tile{display:flex;width:1280px;height:854px}
  .main{flex:0 0 75%;background:#000;display:flex;align-items:center;justify-content:center}
  .main img{width:62%;max-width:640px;display:block}
  .strip{flex:1;display:flex;flex-direction:column}
  .strip span{flex:1;display:block}
</style></head>
<body>
  <div class="tile">
    <div class="main"><img src="assets/logo-monogram-horizontal-on-dark.svg" alt="NGN"></div>
    <div class="strip">
      <span style="background:#A4804A"></span>
      <span style="background:#C8102E"></span>
      <span style="background:#a80c26"></span>
      <span style="background:#85091e"></span>
    </div>
  </div>
</body></html>
